services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiendita-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en el archivo .env}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      # La API no usa sesiones ni colas; evita depender de tablas que no existen en Neon
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:?Define DB_HOST en el archivo .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?Define DB_DATABASE en el archivo .env}
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en el archivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_SECRET: ${STRIPE_SECRET}
      L5_SWAGGER_CONST_HOST: ${L5_SWAGGER_CONST_HOST}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      GENERATE_SWAGGER: ${GENERATE_SWAGGER:-true}
    ports:
      - "8000:8000"
    networks:
      - tiendita-net

  # frontend:   <- lo agregan tus compañeros
  #   depends_on:
  #     api:
  #       condition: service_healthy

networks:
  tiendita-net:

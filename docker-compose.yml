services:
  db:
    image: mysql:8.0
    container_name: tiendita-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tiendita-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiendita-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en el archivo .env}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_SECRET: ${STRIPE_SECRET}
      L5_SWAGGER_CONST_HOST: ${L5_SWAGGER_CONST_HOST}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      GENERATE_SWAGGER: ${GENERATE_SWAGGER:-true}
    ports:
      - "8000:8000"
    networks:
      - tiendita-net

  # frontend:   <- lo agregan tus compañeros
  #   depends_on:
  #     api:
  #       condition: service_healthy

volumes:
  db_data:

networks:
  tiendita-net: